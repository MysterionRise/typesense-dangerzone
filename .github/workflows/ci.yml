name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  TYPESENSE_API_KEY: "test-ci-key"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run Ruff formatter check
        run: ruff format --check src tests

      - name: Run mypy
        run: mypy src tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit detect-secrets
          pip install -e ".[dev]"

      - name: Run Bandit security scan
        run: bandit -r src -c pyproject.toml

      - name: Run pip-audit
        run: pip-audit

      - name: Run detect-secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets audit --report --baseline .secrets.baseline || true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start Typesense
        run: |
          docker run -d --name typesense \
            -p 8108:8108 \
            typesense/typesense:27.1 \
            --data-dir=/tmp --api-key=${{ env.TYPESENSE_API_KEY }} --enable-cors

      - name: Wait for Typesense
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8108/health | grep -q '"ok":true'; then
              echo "Typesense is ready"
              exit 0
            fi
            echo "Waiting for Typesense... (attempt $i)"
            sleep 2
          done
          echo "Typesense failed to start"
          docker logs typesense
          exit 1

      - name: Run unit tests
        run: pytest tests/unit -v --cov --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        env:
          TYPESENSE_API_KEY: ${{ env.TYPESENSE_API_KEY }}
          TYPESENSE_HOST: localhost
          TYPESENSE_PORT: "8108"
        run: pytest tests/integration -v -m integration --no-cov

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Stop Typesense
        if: always()
        run: docker stop typesense || true

  all-checks-pass:
    name: All Checks Pass
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed!"
