version: '3.8'

services:
  typesense:
    image: typesense/typesense:29.0
    container_name: typesense-hybrid-demo
    restart: on-failure
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
      # Model cache for auto-embedding (first run downloads ~1-2GB)
      - typesense-model-cache:/root/.cache/huggingface
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz123_demo_key_change_in_production}
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_ENABLE_CORS=true
      # Optional: GPU support for faster embeddings (requires nvidia-docker)
      # - NVIDIA_VISIBLE_DEVICES=all
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-xyz123_demo_key_change_in_production}
      --enable-cors
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep '200' && exec 3>&-"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - typesense-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: typesense-seeder
    depends_on:
      typesense:
        condition: service_healthy
    environment:
      - TYPESENSE_HOST=${TYPESENSE_HOST:-typesense}
      - TYPESENSE_PORT=${TYPESENSE_PORT:-8108}
      - TYPESENSE_PROTOCOL=${TYPESENSE_PROTOCOL:-http}
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz123_demo_key_change_in_production}
      - NUM_PRODUCTS=${NUM_PRODUCTS:-30000}
      - NUM_BRANDS=${NUM_BRANDS:-500}
      - RANDOM_SEED=${RANDOM_SEED:-42}
    volumes:
      - ./data:/data
      - ./backend:/app
    networks:
      - typesense-network
    command: |
      sh -c "
        echo '🚀 Starting Typesense data seeding pipeline...'
        python /app/synth_data.py &&
        python /app/index_products.py &&
        python /app/index_brands.py &&
        python /app/synonyms_overrides.py &&
        python /app/query_suggestions_setup.py &&
        echo '✅ Seeding complete! Typesense is ready.'
      "

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: typesense-ui
    depends_on:
      backend:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_TYPESENSE_HOST=${NEXT_PUBLIC_TYPESENSE_HOST:-localhost}
      - NEXT_PUBLIC_TYPESENSE_PORT=${NEXT_PUBLIC_TYPESENSE_PORT:-8108}
      - NEXT_PUBLIC_TYPESENSE_PROTOCOL=${NEXT_PUBLIC_TYPESENSE_PROTOCOL:-http}
      # Search-only key will be generated by backend and read from env
      - NEXT_PUBLIC_TYPESENSE_SEARCH_ONLY_API_KEY=${NEXT_PUBLIC_TYPESENSE_SEARCH_ONLY_API_KEY:-}
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/.next
    networks:
      - typesense-network
    command: npm run dev

volumes:
  typesense-data:
    driver: local
  typesense-model-cache:
    driver: local

networks:
  typesense-network:
    driver: bridge
