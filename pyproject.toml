[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typesense-dangerzone"
version = "0.1.0"
description = "Enterprise-grade Typesense search examples with Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Konstantin P" }]
keywords = ["typesense", "search", "indexing", "full-text-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "typesense>=0.21.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.4.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
    "commitizen>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/konstantinp/typesense-dangerzone"
Repository = "https://github.com/konstantinp/typesense-dangerzone.git"
Issues = "https://github.com/konstantinp/typesense-dangerzone/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/typesense_dangerzone"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit
]
ignore = [
    "S101",    # Use of assert (needed for tests)
    "PLR2004", # Magic value comparison
    "PLR0913", # Too many arguments (acceptable for search functions with options)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow asserts in tests
    "ARG",     # Unused arguments (fixtures)
    "PLR2004", # Magic values in tests
    "E501",    # Line too long (test assertions can be verbose)
    "PLC0415", # Import not at top of file (fixtures need dynamic imports)
    "SIM105",  # Use contextlib.suppress (explicit try/except clearer in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["typesense_dangerzone"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "typesense.*"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=src/typesense_dangerzone",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require Typesense running)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/typesense_dangerzone"]
branch = true
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert used for type narrowing

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/typesense_dangerzone/__init__.py:__version__",
]
